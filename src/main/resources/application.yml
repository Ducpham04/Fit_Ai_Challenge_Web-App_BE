spring:
  application:
    name: FIT_Challenge

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fit_challenge?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
      additional-paths:
        - src/main/java
        - src/main/resources

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8081
  shutdown: graceful

logging:
  level:
    root: INFO
    com.fit: DEBUG
    com.zaxxer.hikari: INFO


